# 看看客户端 · macOS 安装包（手动触发；维护者在私有仓库里用 scripts/release.sh publish 导出代码、推送并触发）。
#
# 客户端按平台拆成三个工作流：client-linux、client-windows、client-macos，各自独立构建、各自失败，互不连累。
# 每个平台构建完把安装包传到 Release client-v{版本}（第一次建成 Pre-release），再合并出 beta 通道的 release.json
# ——看看服务端 5 分钟内同步，beta 用户就能更新到已构建的平台。三个平台都好了以后，
# 用 client-release 工作流（release.sh promote）把它转成正式版。
# 某个平台失败：修好后只重跑这个平台（release.sh publish --only macos），覆盖它自己的文件，其它平台不动。
#
# macOS（Apple 芯片）：必须在 macOS runner 上原生编译（托盘等要链接 Apple 系统框架）；随包的 ttyd 用 zig 编译；另出 .dmg。
#
# 需要的仓库 secrets：LOOKLOOK_SERVER_URL（客户端默认服务端地址，编译时写入）、可选 LOOKLOOK_PLATFORM_KEYS（p1=<base64url>）。
name: client-macos

on:
  workflow_dispatch:

concurrency:
  group: client-macos
  cancel-in-progress: false

permissions:
  contents: write # 建 Pre-release、上传安装包

env:
  ZIG_VERSION: 0.15.2

jobs:
  prepare:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: 版本、更新说明、还没转正式版
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-stage.sh preflight

  build:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client
    env:
      ZIG_SHA256_MACOS: 3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
          key: macos
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            client/.cache
            client/vendor
          key: client-vendor-macos-${{ hashFiles('client/scripts/fetch-vendor.sh', 'client/scripts/build-mux.sh', 'client/scripts/build-ttyd-macos.sh', 'client/scripts/build-fonts.py', 'client/scripts/data/**') }}

      # 打包脚本用 bash 4（关联数组）、GNU tar（--owner）与 sha256sum：macOS 自带的是 bash 3.2 / bsdtar。
      - name: 构建工具
        run: |
          set -euo pipefail
          brew install bash coreutils gnu-tar
          prefix=$(brew --prefix)
          {
            echo "$prefix/opt/coreutils/libexec/gnubin"
            echo "$prefix/opt/gnu-tar/libexec/gnubin"
            echo "$prefix/bin"
          } >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet fonttools brotli
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 3 -o /tmp/zig.tar.xz "https://ziglang.org/download/$ZIG_VERSION/zig-aarch64-macos-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256_MACOS  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig" && tar -C "$RUNNER_TEMP/zig" -xJf /tmp/zig.tar.xz
          echo "$RUNNER_TEMP/zig/zig-aarch64-macos-$ZIG_VERSION" >> "$GITHUB_PATH"

      # 代码签名：每个版本都用同一张（自签名）证书签，macOS 才把升级后的看看认成同一个应用，不再重新询问文件夹访问权限。
      # 证书由 client/scripts/macos-sign-cert.sh 生成一次，放在 secrets 里；没有时 ad-hoc 签名（照常能用，只是升级后会再问）。
      - name: 导入签名证书
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z ${MACOS_SIGN_P12:-} ]]; then
            echo "::warning::没有设置 MACOS_SIGN_P12：ad-hoc 签名，用户升级后 macOS 会重新询问文件夹访问权限"
            exit 0
          fi
          kc=$RUNNER_TEMP/sign.keychain-db
          kcpw=$(openssl rand -hex 16)
          printf '%s' "$MACOS_SIGN_P12" | base64 --decode >"$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$MACOS_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # 自签名证书要先被信任为代码签名证书，codesign 才肯用
          security find-certificate -a -p "$kc" >"$RUNNER_TEMP/sign.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/sign.pem"
          id=$(security find-identity -v -p codesigning "$kc" | awk '$2 ~ /^[0-9A-F]{40}$/ { print $2; exit }')
          if [[ -z $id ]]; then
            echo "::error::钥匙串里没有可用的代码签名证书"
            security find-identity -p codesigning "$kc"
            exit 1
          fi
          echo "签名证书 $id"
          echo "LOOKLOOK_MACOS_SIGN_IDENTITY=$id" >>"$GITHUB_ENV"

      - name: 打包
        env:
          LOOKLOOK_SERVER_URL: ${{ secrets.LOOKLOOK_SERVER_URL }}
          LOOKLOOK_PLATFORM_KEYS: ${{ secrets.LOOKLOOK_PLATFORM_KEYS }}
        run: |
          set -euo pipefail
          bash --version | head -1
          [[ $LOOKLOOK_SERVER_URL == https://* ]] || { echo "::error::secret LOOKLOOK_SERVER_URL 未设置或不是 https 地址"; exit 1; }
          [[ -n $LOOKLOOK_PLATFORM_KEYS ]] || unset LOOKLOOK_PLATFORM_KEYS
          npm ci --no-audit --no-fund
          scripts/package.sh darwin-aarch64
          # 签名的标识和证书：升级前后要一样（见 scripts/package.sh 的 mac_sign）
          codesign -dvv "$(find target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)" 2>&1 | grep -E '^(Identifier|Authority|Signature)=' || true

      - name: 上传到 beta Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-stage.sh upload macos

  # 按已上传的平台重新生成 release.json（beta 通道）：各平台的合并串行执行（concurrency 组 client-stage）。
  merge:
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: client-stage
      cancel-in-progress: false
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: 合并 release.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-stage.sh merge
